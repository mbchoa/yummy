name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: yummy
          POSTGRES_PASSWORD: yummy
          POSTGRES_DB: yummy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yummy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SKIP_ENV_VALIDATION: 1
      TEST_DATABASE_URL: postgresql://yummy:yummy@localhost:5432/yummy_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Migrate the test database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Test
        run: pnpm test
